name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile app.py cli.py downloader.py migrate.py wrapperctl.py
          echo "py_compile OK"

      - name: Shell script syntax check
        run: |
          for f in setup.sh install.sh install_linux.sh setup_wrapper.sh fix_wrapper_libs.sh \
                   login_wrapper.sh login2fa.sh setup_amdl_wrapper.sh make_app.sh start.sh; do
            [ -f "$f" ] && bash -n "$f" && echo "bash -n OK: $f"
          done
          # .command files (double-click launchers) too
          bash -n "Start Music High Res.command" && echo "bash -n OK: Start Music High Res.command"

      # pwsh (PowerShell Core) ships on GitHub-hosted runners, so the Windows
      # launcher scripts can be syntax-checked on the same Linux job.
      - name: PowerShell syntax check (Windows launchers)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('start.ps1', 'setup.ps1', 'install.ps1')
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $f:"
              $errors | ForEach-Object { Write-Host "  $($_.Message) (line $($_.Extent.StartLineNumber))" }
              exit 1
            }
            Write-Host "PS parse OK: $f"
          }

      - name: Smoke import (app + modules load)
        run: |
          python - <<'PY'
          import downloader, migrate
          cfg = downloader.Config()
          assert cfg.get("output_path"), "config loads with defaults"
          m = downloader.JobManager(cfg)
          assert m.any_active() is False
          print("imports + JobManager smoke OK")
          PY

      - name: JS syntax check (inline script of the UI)
        run: |
          node --version
          python - <<'PY'
          import re
          html = open("static/index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "no inline script found"
          open("/tmp/ui.js", "w", encoding="utf-8").write(scripts[-1])
          print("extracted inline script")
          PY
          node --check /tmp/ui.js && echo "JS OK"

  # Windows smoke: the app code must import + py_compile cleanly on Windows
  # (venv Scripts layout, explorer open path, wrapper bash guard all differ).
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          python -m py_compile app.py cli.py downloader.py migrate.py wrapperctl.py
          Write-Output "py_compile OK"

      - name: Smoke import + Windows-aware helpers
        # Git Bash ships on windows-latest runners, so a bash heredoc works.
        shell: bash
        run: |
          python - <<'PY'
          import downloader
          # venv_bin must probe the Windows Scripts layout without crashing.
          _ = downloader.venv_bin('votify')
          # gamdl_binary falls back to PATH; must never raise on Windows.
          try:
              downloader.gamdl_binary()
          except Exception as e:
              raise SystemExit(f'gamdl_binary raised on Windows: {e}')
          cfg = downloader.Config()
          assert cfg.get('output_path')
          print('Windows smoke import OK')
          PY

      - name: PowerShell syntax check (Windows launchers)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('start.ps1', 'setup.ps1', 'install.ps1')
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "Syntax errors in $f:"
              $errors | ForEach-Object { Write-Host "  $($_.Message) (line $($_.Extent.StartLineNumber))" }
              exit 1
            }
            Write-Host "PS parse OK: $f"
          }
